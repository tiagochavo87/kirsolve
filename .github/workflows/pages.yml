name: Pages

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "assets/logo.jpeg"
      - "src/kirsolve/**"
      - "docs/index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Monta o site como um espelho literal do que roda localmente: os mesmos
      # arquivos-fonte, sem etapa de build. app.py ja detecta 'src/' via
      # sys.path quando a pasta existe ao lado dele, entao o mesmo layout usado
      # em desenvolvimento funciona direto no navegador via stlite.
      - name: Montar site estatico
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/src/kirsolve
          cp docs/index.html _site/index.html
          cp app.py _site/app.py
          cp assets/logo.jpeg _site/logo.jpeg
          cp src/kirsolve/*.py _site/src/kirsolve/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Publicar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
