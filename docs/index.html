<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kirsolve</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.css" />
  <style>
    /* tela de carregamento: o runtime Pyodide leva alguns segundos para baixar
       na primeira visita, e sem isso a pagina fica em branco nesse meio-tempo */
    html, body { margin: 0; height: 100%; background: #fafafa; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.75rem;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #3f3f46;
    }
    #boot .spinner {
      width: 2rem; height: 2rem; border-radius: 50%;
      border: 3px solid #3f7f6f33; border-top-color: #3f7f6f;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #root:not(:empty) + #boot, #boot.done { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot">
    <div class="spinner"></div>
    <div>Carregando o kirsolve (primeira vez: ~50&nbsp;MB, depois fica em cache)&hellip;</div>
  </div>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";

    // Mesmos arquivos-fonte do pacote (src/kirsolve/*.py) + app.py, sem build
    // intermediario: o que roda no navegador e byte a byte o que roda local,
    // porque app.py ja resolve 'src/' via sys.path quando a pasta existe.
    const MODULOS = [
      "__init__.py", "__main__.py", "cli.py", "em.py", "loaders.py",
      "nomenclature.py", "parsing.py", "priors.py", "report.py",
      "resolve.py", "validate.py",
    ];

    const files = {
      "app.py": { url: "./app.py" },
      "assets/logo.jpeg": { url: "./logo.jpeg" },
    };
    for (const m of MODULOS) {
      files[`src/kirsolve/${m}`] = { url: `./src/kirsolve/${m}` };
    }

    mount(
      {
        requirements: ["pandas", "numpy", "openpyxl"],
        entrypoint: "app.py",
        files,
      },
      document.getElementById("root"),
    );
  </script>
</body>
</html>
